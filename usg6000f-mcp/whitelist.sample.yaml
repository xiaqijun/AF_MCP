# USG6000F 白名单配置样例
# 本文件由甲方安全负责人核对后纳入版本库，实施期在 D13 加载
# 严格按五层匹配，任一命中视为白名单命中，封禁操作被拒绝

# -----------------------------------------------------------------------------
# L1 IP / CIDR
# -----------------------------------------------------------------------------
ip:
  - cidr: 10.0.0.0/8
    comment: 内网核心段
  - cidr: 172.16.0.0/12
    comment: 业务系统段
  - cidr: 192.168.0.0/16
    comment: 办公段
  # 以下条目由甲方在实施基线 §3.1 提供后回填
  # - cidr: <办公出口 IP>/32
  #   comment: 甲方办公出口公网 IP（防止 SNAT 误封）
  # - cidr: <运维堡垒机 IP>/32
  #   comment: 运维堡垒机

# -----------------------------------------------------------------------------
# L2 ASN
# -----------------------------------------------------------------------------
asn:
  - asn: 4134
    comment: 中国电信 CHINANET-BACKBONE
  - asn: 4837
    comment: 中国联通 CHINA169-BACKBONE
  - asn: 9808
    comment: 中国移动 CMNET
  # - asn: <合作伙伴 ASN>
  #   comment: <说明>

# -----------------------------------------------------------------------------
# L3 Domain（按源 IP 的 PTR 反查结果匹配；由上层传入）
# -----------------------------------------------------------------------------
domain:
  - pattern: "*.cmhk.com"
    comment: 甲方主域

# -----------------------------------------------------------------------------
# L4 资产标签（由 SIP 资产接口 tag 或研判智能体传入）
# action 可取 block（拒绝封禁）/ warn（仅告警）/ allow（正常封禁）
# -----------------------------------------------------------------------------
tag:
  - tag: core_business
    action: block
    comment: 核心业务资产，禁止任何自动封禁
  - tag: dr_site
    action: block
    comment: 灾备站点
  - tag: ops_segment
    action: block
    comment: 运维段
  - tag: safety_critical
    action: block
    comment: 安全关键系统

# -----------------------------------------------------------------------------
# L5 业务时段
# -----------------------------------------------------------------------------
biz_hour:
  timezone: Asia/Shanghai
  workdays: [mon, tue, wed, thu, fri]
  work_hours:
    start: "09:00"
    end:   "18:00"
  # action: warn 表示工作时段仅告警（不拒绝）；改 block 表示工作时段禁止自动封
  action: warn
  holidays:
    - 2026-05-01
    - 2026-05-02
    - 2026-05-03
    - 2026-10-01
    - 2026-10-02
    - 2026-10-03
